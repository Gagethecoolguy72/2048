<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2048</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      color: #eee;
      font-family: "Segoe UI", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
    }

    h1 {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #f7c948;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 20px;
    }

    .scoreboard {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
    }

    .score-box {
      background: #16213e;
      border-radius: 8px;
      padding: 10px 24px;
      text-align: center;
      min-width: 100px;
    }

    .score-box label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 4px;
    }

    .score-box span {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f7c948;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      background: #0f3460;
      color: #eee;
      border: none;
      border-radius: 8px;
      padding: 10px 22px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #1a5276; }

    #board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      background: #16213e;
      border-radius: 12px;
      padding: 12px;
      width: 380px;
      height: 380px;
    }

    .cell {
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 800;
      transition: transform 0.08s ease, background 0.08s ease;
      background: #0a0a23;
      color: transparent;
    }

    .cell.pop { animation: pop 0.12s ease; }

    @keyframes pop {
      0%   { transform: scale(0.85); }
      60%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    /* tile colors */
    .v2    { background: #1e3a5f; color: #cce; }
    .v4    { background: #1b4d8e; color: #dde; }
    .v8    { background: #c0392b; color: #ffe; }
    .v16   { background: #e74c3c; color: #fff; }
    .v32   { background: #e67e22; color: #fff; }
    .v64   { background: #f39c12; color: #fff; font-size: 1.5rem; }
    .v128  { background: #f7c948; color: #333; font-size: 1.4rem; }
    .v256  { background: #2ecc71; color: #fff; font-size: 1.3rem; }
    .v512  { background: #1abc9c; color: #fff; font-size: 1.2rem; }
    .v1024 { background: #9b59b6; color: #fff; font-size: 1.1rem; }
    .v2048 { background: #f7c948; color: #1a1a2e; font-size: 1rem; box-shadow: 0 0 24px #f7c94888; }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
      z-index: 10;
    }

    .overlay.show { display: flex; }

    .overlay h2 {
      font-size: 2.5rem;
      font-weight: 900;
    }

    .overlay.win h2 { color: #f7c948; }
    .overlay.lose h2 { color: #e74c3c; }

    .overlay p { color: #aaa; font-size: 1rem; }

    .hint {
      margin-top: 16px;
      font-size: 0.78rem;
      color: #555;
    }
  </style>
</head>
<body>

<h1>2048</h1>
<p class="subtitle">Merge tiles to reach <strong>2048</strong></p>

<div class="scoreboard">
  <div class="score-box"><label>Score</label><span id="score">0</span></div>
  <div class="score-box"><label>Best</label><span id="best">0</span></div>
</div>

<div class="controls">
  <button onclick="newGame()">New Game</button>
  <button onclick="undoMove()">Undo</button>
</div>

<div id="board"></div>

<p class="hint">Arrow keys or WASD &nbsp;|&nbsp; Swipe on mobile</p>

<div class="overlay win" id="winOverlay">
  <h2>You Win!</h2>
  <p>You reached 2048!</p>
  <button onclick="keepPlaying()">Keep Playing</button>
  <button onclick="newGame()">New Game</button>
</div>

<div class="overlay lose" id="loseOverlay">
  <h2>Game Over</h2>
  <p id="loseScore"></p>
  <button onclick="newGame()">Try Again</button>
</div>

<script>
const SIZE = 4;
let grid, score, best, history, won, keepGoing;

function newGame() {
  grid = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
  score = 0;
  history = [];
  won = false;
  keepGoing = false;
  best = +localStorage.getItem("2048best") || 0;
  hide("winOverlay"); hide("loseOverlay");
  addTile(); addTile();
  render();
}

function keepPlaying() {
  keepGoing = true;
  hide("winOverlay");
}

function addTile() {
  const empty = [];
  grid.forEach((row, r) => row.forEach((v, c) => { if (!v) empty.push([r,c]); }));
  if (!empty.length) return;
  const [r, c] = empty[Math.floor(Math.random() * empty.length)];
  grid[r][c] = Math.random() < 0.9 ? 2 : 4;
}

function clone(g) { return g.map(r => [...r]); }

function undoMove() {
  if (!history.length) return;
  const prev = history.pop();
  grid = prev.grid;
  score = prev.score;
  won = prev.won;
  hide("winOverlay"); hide("loseOverlay");
  render();
}

function saveHistory() {
  history.push({ grid: clone(grid), score, won });
  if (history.length > 10) history.shift();
}

function slide(row) {
  let arr = row.filter(v => v);
  let gained = 0;
  for (let i = 0; i < arr.length - 1; i++) {
    if (arr[i] === arr[i+1]) {
      arr[i] *= 2;
      gained += arr[i];
      arr.splice(i+1, 1);
    }
  }
  while (arr.length < SIZE) arr.push(0);
  return { row: arr, gained };
}

function move(dir) {
  saveHistory();
  let moved = false;
  let gained = 0;

  const rotated = rotateGrid(grid, dir);
  const newGrid = rotated.map(row => {
    const { row: slid, gained: g } = slide(row);
    gained += g;
    if (slid.join() !== row.join()) moved = true;
    return slid;
  });
  const finalGrid = unrotateGrid(newGrid, dir);

  if (!moved) { history.pop(); return; }

  grid = finalGrid;
  score += gained;
  if (score > best) { best = score; localStorage.setItem("2048best", best); }

  addTile();
  render();

  if (!won && !keepGoing && grid.some(r => r.includes(2048))) {
    won = true;
    show("winOverlay");
  } else if (!canMove()) {
    document.getElementById("loseScore").textContent = `Final score: ${score}`;
    show("loseOverlay");
  }
}

function rotateGrid(g, dir) {
  // Normalise: always slide left after rotation
  if (dir === "left")  return clone(g);
  if (dir === "right") return g.map(r => [...r].reverse());
  if (dir === "up")    return transpose(g);
  if (dir === "down")  return transpose(g).map(r => [...r].reverse());
}

function unrotateGrid(g, dir) {
  if (dir === "left")  return g;
  if (dir === "right") return g.map(r => [...r].reverse());
  if (dir === "up")    return transpose(g);
  if (dir === "down")  return transpose(g.map(r => [...r].reverse()));
}

function transpose(g) {
  return g[0].map((_, c) => g.map(r => r[c]));
}

function canMove() {
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++) {
      if (!grid[r][c]) return true;
      if (c+1 < SIZE && grid[r][c] === grid[r][c+1]) return true;
      if (r+1 < SIZE && grid[r][c] === grid[r+1][c]) return true;
    }
  return false;
}

function render() {
  const board = document.getElementById("board");
  document.getElementById("score").textContent = score;
  document.getElementById("best").textContent = best;
  board.innerHTML = "";
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++) {
      const v = grid[r][c];
      const cell = document.createElement("div");
      cell.className = "cell" + (v ? ` v${v} pop` : "");
      cell.textContent = v || "";
      board.appendChild(cell);
    }
}

function show(id) { document.getElementById(id).classList.add("show"); }
function hide(id) { document.getElementById(id).classList.remove("show"); }

// Keyboard
document.addEventListener("keydown", e => {
  const map = { ArrowLeft:"left", ArrowRight:"right", ArrowUp:"up", ArrowDown:"down",
                a:"left", d:"right", w:"up", s:"down" };
  const dir = map[e.key];
  if (dir) { e.preventDefault(); move(dir); }
});

// Touch / swipe
let tx = null, ty = null;
document.addEventListener("touchstart", e => {
  tx = e.touches[0].clientX;
  ty = e.touches[0].clientY;
}, {passive: true});
document.addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  tx = ty = null;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if (Math.abs(dx) > Math.abs(dy))
    move(dx > 0 ? "right" : "left");
  else
    move(dy > 0 ? "down" : "up");
}, {passive: true});

newGame();
</script>
</body>
</html>
